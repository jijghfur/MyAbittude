<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyAbittude</title>
    <meta name="description" content="Une application de gestion de tâches intelligente avec rappels, priorités et un design moderne.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="app-container">
        <header>
            <div class="header-content">
                <h1><i class="fa-solid fa-bolt"></i> MyAbittude</h1>
                <p class="subtitle">Votre journée, organisée.</p>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="icon-btn" title="Changer le thème">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="enableNotificationsBtn" class="icon-btn" title="Activer les notifications">
                    <i class="fa-solid fa-bell-slash"></i>
                </button>
            </div>
        </header>

        <section class="progress-section glass-panel">
            <div class="progress-header">
                <h3>Progression</h3>
                <span id="progressText">0/0</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </section>

        <!-- Desktop form, hidden on mobile by default -->
        <section id="addTaskSection" class="add-task-section glass-panel">
            <div class="section-header mobile-only">
                <h3>Nouvelle tâche</h3>
                <button id="closeFormBtn" class="icon-btn-small"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="taskForm">
                <div class="input-group">
                    <input type="text" id="taskTitle" placeholder="Qu'avez-vous prévu ?" required autocomplete="off">
                </div>
                
                <div class="task-options">
                    <div class="option-group">
                        <label for="taskDate"><i class="fa-regular fa-calendar"></i> Échéance</label>
                        <input type="datetime-local" id="taskDate">
                    </div>
                    
                    <div class="option-group">
                        <label for="taskPriority"><i class="fa-solid fa-layer-group"></i> Priorité</label>
                        <select id="taskPriority">
                            <option value="low">Basse 🟢</option>
                            <option value="medium" selected>Moyenne 🟠</option>
                            <option value="high">Haute 🔴</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn" class="primary-btn">
                    <i class="fa-solid fa-plus" id="submitBtnIcon"></i> <span id="submitBtnText">Ajouter la tâche</span>
                </button>
            </form>
        </section>

        <section class="filters-container">
            <div class="filters glass-panel-small">
                <button class="filter-btn active" data-filter="all">Toutes</button>
                <button class="filter-btn" data-filter="pending">À faire</button>
                <button class="filter-btn" data-filter="completed">Terminées</button>
            </div>
        </section>

        <section class="tasks-container">
            <ul id="taskList" class="task-list">
                <!-- Les tâches seront injectées ici par JavaScript -->
            </ul>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon-wrapper">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <h3>Rien à faire</h3>
                <p>Profitez de votre temps libre ou ajoutez une tâche.</p>
            </div>
        </section>
    </div>

    <!-- Mobile Floating Action Button -->
    <button id="fabBtn" class="fab mobile-only">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <i class="fa-solid fa-circle-check"></i>
            <div class="toast-text">
                <p id="toastMessage">Action réussie !</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
